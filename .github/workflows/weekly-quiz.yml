# Writes the weekly Current Affairs quiz every Sunday from the stories
# published in the previous 7 days (scripts/generate-quiz.js), for every age
# group. A set that passes the checks is published; otherwise it waits in the
# admin content tool. GitHub emails the repo owner if a run fails.
#
# Needs the same repository secrets as daily-digest.yml:
#   SUPABASE_URL, SUPABASE_KEY (service_role key), GROQ_API_KEY
name: Weekly quiz

on:
  schedule:
    - cron: '45 0 * * 0'  # Sunday 00:45 UTC = 06:15 India time (after the daily digest)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (write, save nothing)'
        type: boolean
        default: false
      force:
        description: 'Write again even if this week already has questions'
        type: boolean
        default: false

concurrency:
  group: weekly-quiz
  cancel-in-progress: false

jobs:
  quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - name: Write and publish this week's quiz
        run: node scripts/generate-quiz.js ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.force && '--force' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CA_TIME_ZONE: Asia/Kolkata
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-log-${{ github.run_id }}
          path: logs/
          retention-days: 30
          if-no-files-found: ignore

# Writes today's Current Affairs digest every morning (scripts/generate-digest.js).
# Stories with no fact-check problems are published straight away; the rest
# wait in the admin content tool. GitHub emails the repo owner if a run fails.
#
# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL, SUPABASE_KEY (service_role key), GROQ_API_KEY
name: Daily digest

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 05:30 India time, every day
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (fetch and write, save nothing)'
        type: boolean
        default: false

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - name: Write and publish today's stories
        run: node scripts/generate-digest.js ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CA_TIME_ZONE: Asia/Kolkata
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-log-${{ github.run_id }}
          path: logs/
          retention-days: 30
          if-no-files-found: ignore
